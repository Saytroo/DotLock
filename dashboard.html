<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotLock - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="toast" class="toast-notification"></div>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <span id="user-welcome" class="user-welcome">Welcome</span>
            <div class="header-actions">
                <button id="btn-add-trigger" class="btn-add-trigger">+ Add Password</button>
                <button id="btn-logout" class="btn-logout">Logout</button>
            </div>
        </div>

        <div id="add-form" class="add-form-box" style="display: none;">
            <span class="field-label required">* Website / Service Name</span>
            <input type="text" id="site" placeholder="e.g., Google, Netflix">
            
            <span class="field-label optional">Email / Username</span>
            <input type="text" id="email" placeholder="e.g., user@example.com">
            
            <span class="field-label required">* Password</span>
            <input type="password" id="password" placeholder="Enter password">
            
            <button id="btn-enregistrer" class="btn-save">Save Securely</button>
        </div>

        <div id="vault-list">
            </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
