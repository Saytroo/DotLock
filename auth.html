<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotLock - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast" class="toast-notification"></div>

    <div class="auth-container">
        <img src="logo_no_BG.png" alt="DotLock Logo" class="main-logo">
        
        <div class="auth-tabs">
            <div class="tab-slider"></div> <div id="tab-login" class="auth-tab active">LOG IN</div>
            <div id="tab-signup" class="auth-tab">SIGN UP</div>
        </div>
        
        <span class="field-label required">* Username</span>
        <input type="text" id="auth-username" placeholder="Enter your username">
        
        <span class="field-label required">* Master Password</span>
        <input type="password" id="auth-password" placeholder="Enter your master password">
        
        <button id="btn-auth-action" class="btn-auth">Log In</button>
    </div>

    <script src="auth.js" defer></script>
</body>
</html>
